name: Build & Create GitHub Release (MSIX Installer)

on:
  push:
    branches: [ main, master ]
    tags:
      - 'v*'
  workflow_dispatch:

jobs:
  build-and-release:
    runs-on: windows-latest

    permissions:
      contents: write

    steps:
    - name: Checkout Source Code
      uses: actions/checkout@v4

    - name: Setup .NET SDK (8.0.x)
      uses: actions/setup-dotnet@v4
      with:
        dotnet-version: '8.0.x'

    - name: Restore Dependencies
      run: dotnet restore FigPin/FigPin/FigPin.csproj /p:Platform=x64

    - name: Create Developer Certificate & Self-Signed PFX
      shell: powershell
      run: |
        $certBase64 = "${{ secrets.MSIX_PFX_BASE64 }}"
        if ([string]::IsNullOrEmpty($certBase64)) {
            Write-Host "Generating Store Partner Center Developer Certificate..."
            $cert = New-SelfSignedCertificate -Type CodeSigningCert -Subject "CN=808D8BE3-D2A5-4CF6-9F6D-0B5358B6FE53" -FriendlyName "FigPinStoreDev" -CertStoreLocation "Cert:\CurrentUser\My"
            $pwd = ConvertTo-SecureString -String "FigPin123!" -Force -AsPlainText
            Export-PfxCertificate -Cert $cert -FilePath "$env:GITHUB_WORKSPACE\FigPinStoreDev.pfx" -Password $pwd
        } else {
            Write-Host "Decoding secret certificate..."
            $bytes = [System.Convert]::FromBase64String($certBase64)
            [System.IO.File]::WriteAllBytes("$env:GITHUB_WORKSPACE\FigPinStoreDev.pfx", $bytes)
        }

    - name: Build MSIX Package
      shell: powershell
      run: |
        dotnet publish FigPin/FigPin/FigPin.csproj -c Release -r win-x64 /p:Platform=x64 /p:WindowsPackageType=MSIX /p:GenerateAppxPackageOnBuild=true /p:AppxPackageDir="$env:GITHUB_WORKSPACE\dist\installer" /p:AppxPackageSigningEnabled=false

    - name: Sign MSIX Package Container with Signtool
      shell: powershell
      run: |
        $msixFile = Get-ChildItem -Path "$env:GITHUB_WORKSPACE\dist" -Filter "*.msix" -Recurse | Select-Object -First 1
        Write-Host "Signing MSIX package with signtool at: $($msixFile.FullName)"
        
        $signtool = Get-ChildItem -Path "C:\Program Files (x86)\Windows Kits\10\bin" -Filter "signtool.exe" -Recurse | Where-Object { $_.FullName -like "*x64*" } | Select-Object -First 1
        if ($null -eq $signtool) {
            $signtool = Get-ChildItem -Path "C:\Program Files (x86)\Microsoft Visual Studio" -Filter "signtool.exe" -Recurse | Where-Object { $_.FullName -like "*x64*" } | Select-Object -First 1
        }
        
        Write-Host "Using signtool at: $($signtool.FullName)"
        & "$($signtool.FullName)" sign /fd SHA256 /f "$env:GITHUB_WORKSPACE\FigPinStoreDev.pfx" /p "FigPin123!" "$($msixFile.FullName)"
        
        New-Item -ItemType Directory -Force -Path "$env:GITHUB_WORKSPACE\release_assets"
        Copy-Item -Path "$($msixFile.FullName)" -Destination "$env:GITHUB_WORKSPACE\release_assets\edwinjoseph.FigPin_0.1.0.0_x64.msix" -Force
        
        if (Test-Path "$env:GITHUB_WORKSPACE\dist\installer\Install_FigPin_Local.ps1") {
            Copy-Item -Path "$env:GITHUB_WORKSPACE\dist\installer\Install_FigPin_Local.ps1" -Destination "$env:GITHUB_WORKSPACE\release_assets\Install_FigPin_Local.ps1" -Force
        }

    - name: Upload Build Artifacts
      uses: actions/upload-artifact@v4
      with:
        name: FigPin-MSIX-Installer
        path: release_assets/*

    - name: Create or Update GitHub Release
      uses: softprops/action-gh-release@v2
      if: startsWith(github.ref, 'refs/tags/') || github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master' || github.event_name == 'workflow_dispatch'
      with:
        tag_name: ${{ startsWith(github.ref, 'refs/tags/') && github.ref_name || 'v0.1.0' }}
        name: ${{ startsWith(github.ref, 'refs/tags/') && format('FigPin {0}', github.ref_name) || 'FigPin Layer Separator Studio v0.1.0' }}
        body: |
          ## 🚀 FigPin Layer Separator Studio v0.1.0 Release

          ### 📦 Installation Options:
          1. **1-Click Local Sideload**: Download `Install_FigPin_Local.ps1` and `edwinjoseph.FigPin_0.1.0.0_x64.msix` into the same folder. Right-click `Install_FigPin_Local.ps1` -> **Run with PowerShell**.
          2. **Direct MSIX Install**: Double-click `edwinjoseph.FigPin_0.1.0.0_x64.msix` to install.

          ### ✨ Key Features:
          - Topology-Aware AI Subject Segmentation (BiRefNet + Sub-pixel Edge Refinement for 1X, 2X, 4X, 6X potencies)
          - Automatic OCR Text Removal & Generative Background Inpainting
          - Direct PSD Export with Photoshop Layer Preservation
          - Outputs saved directly to `Downloads\FigPin outputs`
        files: |
          release_assets/edwinjoseph.FigPin_0.1.0.0_x64.msix
          release_assets/Install_FigPin_Local.ps1
        draft: false
        prerelease: false
        overwrite_files: true
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
