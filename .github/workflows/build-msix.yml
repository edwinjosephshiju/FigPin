name: Build & Release MSIX Package to Microsoft Store

on:
  push:
    branches: [ main, master ]
    tags:
      - 'v*'
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build-and-publish:
    runs-on: windows-latest

    steps:
    - name: Checkout Source Code
      uses: actions/checkout@v4

    - name: Setup .NET SDK (8.0.x)
      uses: actions/setup-dotnet@v4
      with:
        dotnet-version: '8.0.x'

    - name: Restore Dependencies
      run: dotnet restore FigPin/FigPin/FigPin.csproj

    - name: Create Partner Center Developer Certificate
      shell: powershell
      run: |
        $certBase64 = "${{ secrets.MSIX_PFX_BASE64 }}"
        if ([string]::IsNullOrEmpty($certBase64)) {
            Write-Host "Generating Store Partner Center Developer Certificate..."
            $cert = New-SelfSignedCertificate -Type CodeSigningCert -Subject "CN=808D8BE3-D2A5-4CF6-9F6D-0B5358B6FE53" -FriendlyName "FigPinStoreDev" -CertStoreLocation "Cert:\CurrentUser\My"
            $pwd = ConvertTo-SecureString -String "FigPin123!" -Force -AsPlainText
            Export-PfxCertificate -Cert $cert -FilePath "$env:GITHUB_WORKSPACE\FigPinStoreDev.pfx" -Password $pwd
        } else {
            Write-Host "Decoding secret certificate..."
            $bytes = [System.Convert]::FromBase64String($certBase64)
            [System.IO.File]::WriteAllBytes("$env:GITHUB_WORKSPACE\FigPinStoreDev.pfx", $bytes)
        }

    - name: Build MSIX Package for Microsoft Store
      shell: powershell
      run: |
        dotnet publish FigPin/FigPin/FigPin.csproj -c Release -r win-x64 /p:WindowsPackageType=MSIX /p:GenerateAppxPackageOnBuild=true /p:AppxPackageDir="$env:GITHUB_WORKSPACE\dist\installer" /p:AppxPackageSigningEnabled=false

    - name: Sign MSIX Package
      shell: powershell
      run: |
        $msixFile = Get-ChildItem -Path "$env:GITHUB_WORKSPACE\dist" -Filter "*.msix" -Recurse | Select-Object -First 1
        Write-Host "Signing MSIX package at: $($msixFile.FullName)"
        $cert = New-Object System.Security.Cryptography.X509Certificates.X509Certificate2("$env:GITHUB_WORKSPACE\FigPinStoreDev.pfx", "FigPin123!")
        Set-AuthenticodeSignature -FilePath $msixFile.FullName -Certificate $cert -HashAlgorithm SHA256

    - name: Upload MSIX Package Artifact
      uses: actions/upload-artifact@v4
      with:
        name: FigPin-MSIX-StorePackage
        path: dist/**/*.msix

    - name: Submit Package to Microsoft Store (Partner Center)
      if: startsWith(github.ref, 'refs/tags/v') || github.event_name == 'workflow_dispatch'
      uses: microsoft/store-submission-action@v1
      with:
        tenant-id: ${{ secrets.STORE_TENANT_ID }}
        client-id: ${{ secrets.STORE_CLIENT_ID }}
        client-secret: ${{ secrets.STORE_CLIENT_SECRET }}
        app-id: '9ND5QL4M5T5R'
        package-path: 'dist/installer/edwinjoseph.FigPin_0.1.0.0_x64.msix'
